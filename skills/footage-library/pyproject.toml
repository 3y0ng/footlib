[project]
name = "footlib"
version = "0.1.0"
description = "Local, searchable footage library for video editors"
requires-python = ">=3.11,<3.13"
dependencies = [
    "scenedetect>=0.6.4",
    "opencv-python-headless>=4.9",
    "faster-whisper>=1.1.0",
    "open_clip_torch>=2.26",
    "transformers>=4.40",  # SigLIP tokenizer
    "torch>=2.3",
    "pillow>=10",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
]

[project.scripts]
footlib = "footlib.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["footlib"]

[tool.uv]
# uv-managed Python is built with SQLite extension loading (needed for sqlite-vec).
python-preference = "only-managed"
